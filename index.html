<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Map Quiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="screen start-screen" id="startScreen">
      <h1>🌍 World Map Quiz</h1>
      <p>Kıta seç, ülkeleri bul ve doğru bildikçe haritadan sil!</p>
      <button id="enterBtn">Başla</button>
    </div>

    <div class="screen continent-screen hidden" id="continentScreen">
      <h2>Kıta Seç</h2>
      <div id="continentList" class="continent-list"></div>
    </div>

    <div class="screen game-screen hidden" id="gameScreen">
      <header class="game-top">
        <h2 id="gameTitle">Quiz</h2>
        <div class="stats">
          <span>Süre: <b id="timer">0</b>s</span>
          <span>Kalan: <b id="remaining">0</b></span>
          <span>Doğru: <b id="correct">0</b></span>
        </div>
      </header>

      <div class="question" id="question">Soru hazırlanıyor...</div>
      <div class="map-wrap" id="mapWrap">
        <img id="mapImage" alt="Kıta haritası" />
        <svg id="countryLayer"></svg>
      </div>

      <div class="actions">
        <button id="hintBtn">İpucu</button>
        <button id="backBtn">Kıta Seçimine Dön</button>
      </div>

      <div id="message" class="message"></div>
    </div>

    <script src="data/countries.js"></script>
    <script src="script.js"></script>
  </body>
</html>
